name: zkgroup-wasm-spike

# Weg A, Phase A2: baut Signals auditierte zkgroup-Crate (libsignal,
# Tag v0.95.0) als WASM für den Browser-Client. Reiner Spike — das
# Artefakt wird NICHT automatisch ins Produkt verdrahtet. Erwartung:
# die ersten Läufe können an Dependency-Details scheitern (getrandom-
# Backend, dalek-Patch); Iteration läuft bewusst über CI-Logs, nicht
# über lokale Builds.

on:
  workflow_dispatch:
  push:
    paths:
      - "wasm/zkgroup-wasm/**"
      - ".github/workflows/zkgroup-wasm.yml"

jobs:
  # A3: nativer End-to-End-Test der vollen Credential-Sequenz (Issue →
  # Receive → Present → Verify, inkl. Wire-Roundtrips) gegen die echte
  # auditierte Crate. Läuft nativ (kein wasm-Target, KEIN getrandom-wasm-
  # cfg) und schnell — der Korrektheits-Beweis für das ganze Protokoll.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (libsignal pin)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-23
      - name: cargo test (native, full membership flow)
        working-directory: wasm/zkgroup-wasm
        run: cargo test --release -- --nocapture

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Schreibrecht NUR für den Vendor-Commit-back (client/public/zkgroup/).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Gleiche Toolchain wie libsignal v0.95.0 (rust-toolchain im Repo).
      - name: Rust toolchain (libsignal pin)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-23
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build (release, target web)
        working-directory: wasm/zkgroup-wasm
        env:
          # getrandom 0.3 verlangt das Backend zusätzlich als cfg-Flag;
          # bei getrandom 0.2 im Graph ist das Flag wirkungslos.
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: wasm-pack build --release --target web

      - name: Size report
        run: |
          ls -la wasm/zkgroup-wasm/pkg/
          echo "---- WASM-Groesse (roh) ----"
          du -h wasm/zkgroup-wasm/pkg/*.wasm
          echo "---- gzip (realistische Transfer-Groesse) ----"
          gzip -k -9 wasm/zkgroup-wasm/pkg/*.wasm
          du -h wasm/zkgroup-wasm/pkg/*.wasm.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zkgroup-wasm-pkg
          path: wasm/zkgroup-wasm/pkg/
          retention-days: 30

      # A3-Teil-2: das vorgebaute WASM in den Client vendoren, damit Renders
      # reiner Vite-Build (kein Rust) es einbinden kann. Commit-back berührt
      # NUR client/public/zkgroup/** — das ist NICHT in den Trigger-paths
      # oben, daher kein Re-Trigger; [skip ci] sichert zusätzlich ab.
      - name: Vendor prebuilt WASM into client (commit back)
        if: github.event_name != 'pull_request'
        run: |
          DEST=client/public/zkgroup
          mkdir -p "$DEST"
          cp wasm/zkgroup-wasm/pkg/zkgroup_wasm.js "$DEST/"
          cp wasm/zkgroup-wasm/pkg/zkgroup_wasm_bg.wasm "$DEST/"
          cp wasm/zkgroup-wasm/pkg/zkgroup_wasm.d.ts "$DEST/" 2>/dev/null || true
          cp wasm/zkgroup-wasm/pkg/zkgroup_wasm_bg.wasm.d.ts "$DEST/" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f: pkg/ trägt eine .gitignore, die diese Dateien sonst blockt.
          git add -f "$DEST"
          if git diff --cached --quiet; then
            echo "Kein WASM-Update — nichts zu vendoren."
          else
            git commit -m "chore(zkgroup): vendor prebuilt WASM into client [skip ci]"
            git push origin HEAD:main
          fi
