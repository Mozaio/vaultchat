[package]
name = "umbra"
version = "1.0.0"
description = "Umbra — private, end-to-end encrypted messenger"
authors = ["Umbra"]
edition = "2021"
rust-version = "1.77.2"

# The library is what Tauri runs; main.rs is a thin launcher. Keeping a lib
# crate keeps the door open for a future Tauri-mobile target without
# restructuring (we still ship mobile via Capacitor, but this costs nothing).
[lib]
name = "umbra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller, safer release binaries — fits the "tiny attack surface" goal.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
