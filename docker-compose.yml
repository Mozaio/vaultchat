services:
  vaultchat:
    build: .
    ports:
      - "8787:8787"
    environment:
      VAULTCHAT_JWT_SECRET: ${VAULTCHAT_JWT_SECRET:-change-me-use-openssl-rand-base64-48-min-32-chars}
      VAULTCHAT_DEPLOYMENT_PROFILE: ${VAULTCHAT_DEPLOYMENT_PROFILE:-preview}
      VAULTCHAT_SERVE_SPA: "1"
      PORT: "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
