# Render Blueprint fuer VaultChat — Server + Client in einem Rutsch.
# Nutzung:  Render Dashboard -> "New +" -> "Blueprint" -> Repo waehlen.
#
# Kostenlos:
#   - Web Service  "vaultchat-server"   : Free Plan (schlaeft nach 15 min Inaktivitaet)
#   - Static Site  "vaultchat-client"   : Free Plan (schlaeft NIE, global per CDN)
#
# Die Cross-URLs sind **fest verdrahtet** auf die Render-Default-Hostnamen
# (<service-name>.onrender.com). Wenn du die Services umbenennst oder eine
# Custom Domain nutzt, musst du VITE_API_BASE, VITE_WS_URL und
# VAULTCHAT_CORS_ORIGIN entsprechend anpassen.

services:
  # --- BACKEND: Node + WebSocket ---
  - type: web
    name: vaultchat-server
    env: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VAULTCHAT_JWT_SECRET
        generateValue: true
      # Exakt auf die Client-URL setzen, sonst blockt der Browser die API
      # bei production-artigem CORS-Verhalten.
      - key: VAULTCHAT_CORS_ORIGIN
        value: https://vaultchat-client.onrender.com
      - key: VAULTCHAT_CLIENT_ORIGINS
        value: https://vaultchat-client.onrender.com
      - key: VAULTCHAT_CONNECT_ORIGINS
        value: https://vaultchat-client.onrender.com
      # Free Render Web Services haben ein ephemeres Dateisystem.
      # Fuer Restart-stabile Accounts/PreKeys nur setzen, wenn ein Paid Disk
      # oder ein vergleichbar persistenter Mount vorhanden ist.
      - key: VAULTCHAT_STATE_FILE
        sync: false
      # ALLE folgenden Variablen sind OPTIONAL.
      # Leer lassen -> STUN-Fallback (Google) wird verwendet.
      # Nur setzen, wenn du Calls hinter strikten Firewalls / symmetric NAT
      # erzwingen willst und einen eigenen/gemieteten TURN-Server hast.
      - key: VAULTCHAT_TURN_URL
        sync: false
      - key: VAULTCHAT_TURN_USER
        sync: false
      - key: VAULTCHAT_TURN_PASS
        sync: false
      # "1" -> zwingt Client in iceTransportPolicy:"relay" (keine IP-Leaks,
      # aber Calls funktionieren dann nur mit gesetztem TURN-Server).
      - key: VAULTCHAT_FORCE_RELAY
        sync: false
  # --- FRONTEND: Vite-SPA statisch ---
  # Static Sites werden global ueber Renders CDN ausgeliefert und akzeptieren
  # daher KEIN `region`- und KEIN `plan`-Feld.
  - type: web
    name: vaultchat-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Diese beiden Variablen zeigen auf den erreichbaren VaultChat-Server.
      - key: VITE_API_BASE
        value: https://vaultchat-server-g0p2.onrender.com
      - key: VITE_WS_URL
        value: wss://vaultchat-server-g0p2.onrender.com
      - key: VITE_VAULTCHAT_ENABLE_X3DH
        value: "1"
    routes:
      # SPA-Fallback: alle unbekannten Pfade -> index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        # wasm-unsafe-eval ist nötig für libsodium-wrappers-sumo (Argon2-WASM)
        # und @matrix-org/olm (Olm-WASM, auditierte DR/Megolm-Implementation).
        # Beide Module instanziieren das WASM-Modul über `WebAssembly.instantiate`,
        # was unter aktueller Browser-Auslegung wasm-unsafe-eval verlangt.
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; script-src-attr 'none'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://vaultchat-server-g0p2.onrender.com wss://vaultchat-server-g0p2.onrender.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(self), geolocation=()
