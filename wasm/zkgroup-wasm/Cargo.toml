[package]
name = "zkgroup-wasm"
# 0.1.3: A3-2d — create_membership_presentation (Client-Hälfte aus Bytes),
# echte Presentation aus SERVER-Credential für den Server-Verify-Roundtrip.
version = "0.1.3"
edition = "2021"
publish = false
description = "Spike: Signals auditiertes zkgroup (libsignal) als WASM für den Umbra-Browser-Client"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
zkgroup = { git = "https://github.com/signalapp/libsignal", tag = "v0.95.0" }
libsignal-core = { git = "https://github.com/signalapp/libsignal", tag = "v0.95.0" }
# wasm32-Hedge: je nachdem welche getrandom-Major im Dependency-Graph
# landet, braucht sie ihr Browser-Feature. Beide aktivieren ist harmlos —
# Features unifizieren pro Major-Version.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[patch.crates-io]
# Identisch zu libsignals Workspace-Patch (Cargo.toml @ v0.95.0):
# zkgroup braucht Signals curve25519-dalek-Fork (lizard/Ristretto-Zusätze).
# Workspace-Patches gelten NICHT transitiv für Git-Dependencies, deshalb
# müssen wir den Patch hier replizieren.
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }

[profile.release]
opt-level = "z"
lto = true
